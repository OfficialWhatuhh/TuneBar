name: Build

# Every push to main builds TuneBar.
# If the <Version> in src/TuneBar/TuneBar.csproj hasn't been released yet,
# a release called vX.Y.Z is created automatically with the .exe files attached.
# So to ship an update: bump <Version> in the .csproj and push.
#
# Releases you publish by hand on the website also get the .exe files attached.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out version and whether to release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VER=$(echo "$TAG" | grep -oE '[0-9]+(\.[0-9]+){0,3}' | head -n1 || true)
            [ -z "$VER" ] && VER="1.0.0"
            RELEASE=true
          else
            VER=$(grep -oE '<Version>[^<]+</Version>' src/TuneBar/TuneBar.csproj | sed -E 's#</?Version>##g' | head -n1 || true)
            [ -z "$VER" ] && VER="1.0.0"
            TAG="v$VER"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              RELEASE=false
              echo "$TAG already released, just building."
            else
              RELEASE=true
              echo "$TAG not released yet, will create it."
            fi
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Build x64
        run: >
          dotnet publish src/TuneBar/TuneBar.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.VERSION }}
          -o out/x64

      - name: Build ARM64
        run: >
          dotnet publish src/TuneBar/TuneBar.csproj -c Release -r win-arm64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.VERSION }}
          -o out/arm64

      - name: Rename files
        shell: bash
        run: |
          mkdir dist
          cp out/x64/TuneBar.exe dist/TuneBar-win-x64.exe
          cp out/arm64/TuneBar.exe dist/TuneBar-win-arm64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: TuneBar
          path: dist/*.exe

      - name: Attach to the release (published on the website)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.exe

      - name: Create the release
        if: github.event_name != 'release' && env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: TuneBar ${{ env.VERSION }}
          files: dist/*.exe
          make_latest: true
          body: |
            A Spotify mini-player that lives in your Windows taskbar.

            **Download:** `TuneBar-win-x64.exe` (most PCs) or `TuneBar-win-arm64.exe` (ARM PCs like Snapdragon laptops).
            No install needed: put it in a folder where it can stay and double-click it.

            If Windows says it protected your PC, click **More info**, then **Run anyway**.
