name: Build

# - Every push to main: builds TuneBar so you can see if the code compiles
#   (download the .exe from the run's "Artifacts" section).
# - Pushing a tag like v1.2.0: builds TuneBar and creates a release with the .exe files.
# - Every release published on the website (any tag name): builds TuneBar and
#   attaches the .exe files to that release under "Assets".
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out version number
        shell: bash
        run: |
          # Pull a number like 1.2.3 out of the release tag (v1.2.3, TuneBar_1.2.3, ...).
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VER=$(echo "$TAG" | grep -oE '[0-9]+(\.[0-9]+){0,3}' | head -n1 || true)
          if [ -z "$VER" ]; then VER="1.0.0"; fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building version $VER"

      - name: Build x64
        run: >
          dotnet publish src/TuneBar/TuneBar.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.VERSION }}
          -o out/x64

      - name: Build ARM64
        run: >
          dotnet publish src/TuneBar/TuneBar.csproj -c Release -r win-arm64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.VERSION }}
          -o out/arm64

      - name: Rename files
        shell: bash
        run: |
          mkdir dist
          cp out/x64/TuneBar.exe dist/TuneBar-win-x64.exe
          cp out/arm64/TuneBar.exe dist/TuneBar-win-arm64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: TuneBar
          path: dist/*.exe

      - name: Create the release / attach the files
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: TuneBar ${{ env.VERSION }}
          files: dist/*.exe
          make_latest: true
          body: |
            A Spotify mini-player that lives in your Windows taskbar.

            **Download:** `TuneBar-win-x64.exe` (most PCs) or `TuneBar-win-arm64.exe` (ARM PCs like Snapdragon laptops).
            No install needed: put it in a folder where it can stay and double-click it.

            If Windows says it protected your PC, click **More info**, then **Run anyway**.
